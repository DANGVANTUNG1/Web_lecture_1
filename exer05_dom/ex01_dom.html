<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>DOM 선택 실습</title>
    <script>
        window.onload = function() {
            // TODO 1. ID로 제목 선택 및 색상 변경 
            let title = document.querySelector('#title');
            title.style.color = 'blue';

            // TODO 2. h2 선택 및 텍스트 변경 
            let h2 = document.querySelector('h2');
            h2.innerHTML = 'JavaScript로 변경한 제목';

            // TODO 3. class로 여러 요소 선택 및 색상 변경 
            let items = document.querySelectorAll('.item');
            for (let i = 0; i < items.length; i++) {
                items[i].style.color = 'red';
            }

            // TODO 4. name으로 여러 요소 선택 및 배경색 변경 
            let messages = document.querySelectorAll('[name="message"]');
            for (let i = 0; i < messages.length; i++) {
                messages[i].style.backgroundColor = 'yellow';
            }

            // TODO 5. 모든 p 요소 선택 및 글자 굵기 변경 
            let paragraphs = document.querySelectorAll('p');
            for (let i = 0; i < paragraphs.length; i++) {
                paragraphs[i].style.fontWeight = 'bold';
            }
        };
    </script>
</head>
<body>
    <h1 id="title">DOM 선택 실습</h1>
    <h2>기존 제목</h2>

    <p class="item">첫 번째 항목</p>
    <p class="item">두 번째 항목</p>
    <p class="item">세 번째 항목</p>

    <p name="message">안녕하세요!</p>
    <p name="message">JavaScript 실습입니다.</p>
</body>
</html>
