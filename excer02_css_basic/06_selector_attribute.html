<head>
    <style>
        label {
            display: inline-block;
            width: 80px; /* Sửa từ 800px thành 80px */
        }

        input[type="text"] {
            background-color: lightblue;
        }

        input[type="password"] {
            background-color: lightpink;
        }
    </style>
</head>
<body>
    <h2>회원가입</h2>
    <label>이름:</label>
    <input type="text" placeholder="이름을 입력하세요"><br>
    
    <label>비밀번호:</label> <!-- Sửa lại phần thẻ label bị lỗi cú pháp -->
    <input type="password" placeholder="비밀번호를 입력하세요"><br><br>
    
    <input type="submit" value="가입하기">
</body>
